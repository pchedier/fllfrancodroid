<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Apple rounded squircle base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Ambient light -->
  <circle cx="256" cy="180" r="140" fill="#22d3ee" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Robot Head & Eye Optics (FLL FrancoDroid Icon) -->
  <g transform="translate(106, 116)">
    <!-- Robot Antenna -->
    <rect x="142" y="10" width="16" height="40" rx="8" fill="url(#cyanGrad)"/>
    <circle cx="150" cy="10" r="16" fill="#38bdf8" filter="url(#glow)"/>
    
    <!-- Robot Head Shell -->
    <rect x="20" y="50" width="260" height="190" rx="48" fill="#151b28" stroke="rgba(255,255,255,0.16)" stroke-width="4"/>
    
    <!-- Visor / Eye Display -->
    <rect x="50" y="90" width="200" height="70" rx="28" fill="#090d15" stroke="rgba(34,211,238,0.4)" stroke-width="3"/>
    
    <!-- Dual Sensor Optics -->
    <circle cx="100" cy="125" r="20" fill="url(#cyanGrad)"/>
    <circle cx="100" cy="125" r="9" fill="#ffffff"/>
    
    <circle cx="200" cy="125" r="20" fill="url(#cyanGrad)"/>
    <circle cx="200" cy="125" r="9" fill="#ffffff"/>
    
    <!-- Smile / Intake Grid -->
    <rect x="95" y="180" width="110" height="12" rx="6" fill="#334155"/>
    <circle cx="115" cy="186" r="3" fill="#22d3ee"/>
    <circle cx="150" cy="186" r="3" fill="#22d3ee"/>
    <circle cx="185" cy="186" r="3" fill="#22d3ee"/>
  </g>
  
  <!-- FLL Mission Target Star Emblem -->
  <circle cx="256" cy="400" r="28" fill="#22d3ee" opacity="0.15"/>
  <circle cx="256" cy="400" r="14" fill="url(#cyanGrad)"/>
</svg>
